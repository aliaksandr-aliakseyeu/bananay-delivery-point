name: Trigger auto deployment for bananay-delivery-point

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bananay-delivery-point-AutoDeployTrigger-a9736ad7-2065-40db-a62d-b3e946f98498.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BANANAYDELIVERYPOINT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BANANAYDELIVERYPOINT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BANANAYDELIVERYPOINT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bananayregistry-dxbhdveghzcwh5fw.azurecr.io
          registryUsername: ${{ secrets.BANANAYDELIVERYPOINT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BANANAYDELIVERYPOINT_REGISTRY_PASSWORD }}
          containerAppName: bananay-delivery-point
          resourceGroup: Bananay
          imageToBuild: bananayregistry-dxbhdveghzcwh5fw.azurecr.io/bananay-delivery-point:${{ github.sha }}
          buildArguments: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}


